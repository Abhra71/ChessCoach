# Every change: all of Knightwise's tests, on GitHub's own computer, free. When they fail, GitHub emails the owner,
# so a broken change is noticed even when nobody is working on the app (flagship 6, docs/MAINTAINING.md).
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # the same Stockfish as the app ships (official release, GPL-3), not Ubuntu's: a different version judged a
      # practice move differently and failed a test on 19 Nov 2026. Raise the tag here when the app's engine changes.
      - name: Stockfish 19, the app's engine
        run: |
          curl -sSL -o sf.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          mkdir -p "$RUNNER_TEMP/sf" && tar -xzf sf.tar.gz -C "$RUNNER_TEMP/sf"
          SF=$(find "$RUNNER_TEMP/sf" -type f -name 'stockfish-linux-x86-64*' | head -1); chmod +x "$SF"
          echo uci | "$SF" | head -1  # the version, in the log
          echo "KNIGHTWISE_ENGINE=$SF" >> "$GITHUB_ENV"
      - run: pip install chess==1.11.2 pytest==9.1.1 numpy==2.5.3 keyring==25.7.0 zstandard==0.25.0 ruff==0.17.6  # the same numbers as requirements.txt
      # the code-quality department (28 Nov 2026): real-bug kinds only (ruff.toml); it found /api/stats always failing
      - name: Ruff, real bugs only
        run: ruff check coach tests --output-format github
      - name: All the tests
        env:
          KNIGHTWISE_HOME: ${{ runner.temp }}/knightwise
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        # each failure also becomes a note on the run, readable without signing in to GitHub
        run: |
          set +e
          python -m pytest -q -rfE --ignore=tests/test_live_chesscom.py > pytest.txt 2>&1
          status=$?
          tail -40 pytest.txt
          grep -E "^(FAILED|ERROR) " pytest.txt | head -20 | while read -r l; do echo "::error::$l"; done
          exit $status
