<script type="module">
// The Knightwise trailer (1.0), cut like an action-film trailer: slow and tense, then fast, then slow again.
// Two songs and one switch: Kevin MacLeod's "Hitman" (tense) until the title, then "Ready Aim Fire" (rock) to the end,
// where it stops dead on a bar and rings out. Every cut is on a beat measured from the songs themselves (not a
// tempo guessed from a number: the beats below came from the audio, docs/TRAILER.md says how).
// The narrator is Viktor's voice, slowed; Maya and Viktor each introduce themselves on screen, in their own voices.
// The app is shown full screen and sharp, as it is; the film look (grain, embers, bars) is only for the title cards.
// Every feature gets its title, and every credit comes at the moment its part pays off. Opponents' names never appear.
const W = 1920, H = 1080, FPS_CLIP = 15;
const P = new URLSearchParams(location.search);
const CREATOR = P.get("creator") || "Abhra Chakraborty";  // the owner's name, as they asked (20 Oct)
const cv = document.getElementById("out"), ctx = cv.getContext("2d");

// ---------- the beats, measured (beat tracking on each song's onsets) ----------
const HB = [0.84, 1.63, 2.48, 3.29, 4.11, 4.95, 5.79, 6.58, 7.4, 8.23, 9.05, 9.86, 10.69, 11.52, 12.33, 13.16, 13.99, 14.81, 15.63, 16.45, 17.27, 18.1, 18.91, 19.71, 20.4, 21.18, 21.95, 22.74, 23.43, 24.25, 24.99, 25.78, 26.55];  // Hitman, from the start
const RB = [0.38, 0.72, 1.06, 1.4, 1.72, 2.06, 2.4, 2.74, 3.08, 3.41, 3.75, 4.1, 4.46, 4.81, 5.15, 5.51, 5.86, 6.2, 6.56, 6.9, 7.25, 7.6, 7.94, 8.31, 8.64, 9.0, 9.35, 9.7, 10.04, 10.39, 10.74, 11.09, 11.46, 11.81, 12.16, 12.48, 12.83, 13.17, 13.52, 13.88, 14.24, 14.57, 14.92, 15.28, 15.64, 15.97, 16.32, 16.67, 17.05, 17.37, 17.76, 18.1, 18.42, 18.76, 19.11, 19.46, 19.83, 20.18, 20.54, 20.85, 21.2, 21.52, 21.9, 22.26, 22.62, 22.98, 23.32, 23.64, 24.02, 24.35, 24.69, 25.04, 25.4, 25.74, 26.08, 26.43, 26.78, 27.14, 27.49, 27.83, 28.18, 28.56, 28.91, 29.23, 29.58, 29.92, 30.27, 30.62, 30.97, 31.31, 31.67, 32.02, 32.37, 32.71, 33.07, 33.42, 33.77, 34.13, 34.46, 34.81, 35.17, 35.5, 35.86, 36.2, 36.55, 36.88, 37.24, 37.6, 37.94, 38.3, 38.64, 39.0, 39.35, 39.68, 40.03, 40.39, 40.74, 41.09, 41.47, 41.84, 42.19, 42.53, 42.88, 43.18, 43.53, 43.88, 44.23, 44.58, 44.96, 45.28, 45.61, 45.97, 46.32, 46.67, 47.03, 47.37, 47.74, 48.09, 48.43, 48.78, 49.14, 49.46, 49.8, 50.16, 50.52, 50.89, 51.22, 51.55, 51.89, 52.24, 52.6, 52.97, 53.34, 53.67, 54.03, 54.34, 54.68, 55.04, 55.38, 55.74, 56.11, 56.46, 56.81, 57.14, 57.49, 57.83, 58.19, 58.53, 58.89, 59.22];  // Ready Aim Fire
// the rock is played to a click: one straight line through its beats takes out the few milliseconds of measuring noise
const [R0, BEAT] = (() => { const xs = [], ys = []; for (let i = 9; i < RB.length; i++) { xs.push(i); ys.push(RB[i]); }
  const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let sxy = 0, sxx = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; }); const b = sxy / sxx; return [my - b * mx, b]; })();
const rbeat = i => R0 + i * BEAT;  // Ready Aim Fire's beat i, in the song
const BAR = 4 * BEAT;
const DROP_IN_SONG = rbeat(9);  // the crash where the rock comes in (beat 9)
const TD = 30.1;                // ...and where that lands in the trailer: the title
const tb = n => TD + n * BAR;   // bar n after the title
const STOP = tb(34);            // the rock stops dead here, and rings out
const RAF_AT = TD - (DROP_IN_SONG - rbeat(5));  // the bar before the crash, its run-up, follows the silence

// ---------- the clips: frames recorded from the app, each with when it was shown and where things are ----------
const CLIPS = {};
async function loadClip(name) {
  const meta = await (await fetch(`/ui/vendor/trailer/${name}/frames.json`)).json();
  const keep = []; let last = -1;
  meta.frames.forEach((t, n) => { if (t - last >= 1 / FPS_CLIP) { keep.push({ t, n }); last = t; } });
  await Promise.all(keep.map(k => new Promise(r => { k.img = new Image(); k.img.onload = k.img.onerror = r; k.img.src = `/ui/vendor/trailer/${name}/${k.n}.jpg`; })));
  CLIPS[name] = { ...meta, keep };
}
function frameAt(name, t) {
  const c = CLIPS[name]; if (!c) return null;
  let lo = 0, hi = c.keep.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (c.keep[m].t <= t) lo = m; else hi = m - 1; }
  return c.keep[lo].img;
}
const mark = (name, key, end = true) => { const m = CLIPS[name] && CLIPS[name].marks && CLIPS[name].marks[key]; return m && m.length ? m[end ? m.length - 1 : 0].r : null; };
function around(r, pad = 1.15) {  // a 16:9 window around a box, with some room
  if (!r) return [0, 0, W, H];
  let [x, y, w, h] = r; const cx = x + w / 2, cy = y + h / 2;
  w *= pad; h *= pad; if (w / h > 16 / 9) h = w * 9 / 16; else w = h * 16 / 9;
  w = Math.max(Math.min(w, W), W / 2.2); h = w * 9 / 16;  // never closer than 2.2x: the frames stay sharp
  return [Math.max(0, Math.min(W - w, cx - w / 2)), Math.max(0, Math.min(H - h, cy - h / 2)), w, h];
}
const lerpBox = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const easeS = k => k * k * (3 - 2 * k);
const out3 = k => 1 - Math.pow(1 - k, 3);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const zoomIn = (b, f = 0.9) => { const [x, y, w, h] = b; return [x + w * (1 - f) / 2, y + h * (1 - f) / 2, w * f, h * f]; };
const FULL = [0, 0, W, H];
function drawClip(name, t, from, to, k) {  // the app as it is: no colour grading
  const img = frameAt(name, t); if (!img) return;
  const [x, y, w, h] = lerpBox(from, to, easeS(clamp(k)));
  const z = (img.naturalWidth || W) / W;
  ctx.drawImage(img, x * z, y * z, w * z, h * z, 0, 0, W, H);
}

// ---------- the film: the game of the month, stepped frame by frame from here ----------
let film = null, filmT = 0;
async function loadFilm() {
  const s = await (await fetch("/api/film/month")).json();
  s.white = s.you === "white" ? s.white : "Opponent"; s.black = s.you === "black" ? s.black : "Opponent";
  s.opponent = "Opponent"; s.title = "Your game of the month";
  await new Promise(r => window.Film ? r() : addEventListener("film-ready", r, { once: true }));
  if (film) film();
  filmT = 0;
  film = window.Film.play(document.getElementById("film"), s, { autoplay: false, music: null, onEnd: () => {} });
  film.at = window.Film.timeline(s);
  await new Promise(r => setTimeout(r, 4000));  // the 3D set loads
}
function filmTo(t) { if (film && t > filmT) { film.step(t - filmT); filmT = t; } }
function drawFilm(t, dark = 0) {
  filmTo(t); const c = document.querySelector("#film canvas"); if (!c) return;
  ctx.save(); ctx.filter = "saturate(.8) contrast(1.12)"; ctx.drawImage(c, 0, 0, W, H); ctx.restore();
  if (dark) { ctx.fillStyle = `rgba(0,0,0,${dark})`; ctx.fillRect(0, 0, W, H); }
}
const mateAt = () => film ? film.at[film.at.length - 1] : 40;  // when the last winning move starts, in film time

// ---------- the look, for the title cards and the film: embers, grain, a vignette, cinema bars ----------
const grain = (() => { const g = document.createElement("canvas"); g.width = g.height = 256; const c = g.getContext("2d"), d = c.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 18; }
  c.putImageData(d, 0, 0); return g; })();
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function embers(T, amount) {
  if (amount <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const n = Math.round(70 * amount);
  for (let i = 0; i < n; i++) {
    const sp = 40 + rnd(i) * 90, life = (H + 200) / sp, ph = ((T + rnd(i + 9) * life) % life) / life;
    const x = rnd(i + 3) * W + Math.sin(T * (0.4 + rnd(i + 5)) + i) * 40, y = H + 60 - ph * (H + 200);
    const r = 1.2 + rnd(i + 7) * 3.2, a = (0.35 + 0.65 * Math.abs(Math.sin(T * 3 + i))) * Math.sin(Math.PI * ph);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
    g.addColorStop(0, `rgba(255,190,110,${0.9 * a})`); g.addColorStop(0.3, `rgba(255,110,30,${0.45 * a})`); g.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = g; ctx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
  }
  ctx.restore();
}
function finish(T, c) {
  embers(T, c.embers ?? 0.5);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.5)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = ctx.createPattern(grain, "repeat");
  ctx.translate((T * 997) % 256, (T * 613) % 256); ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 90); ctx.fillRect(0, H - 90, W, 90);
}
function flash(a, color = "255,255,255") { if (a <= 0) return; ctx.fillStyle = `rgba(${color},${Math.min(1, a)})`; ctx.fillRect(0, 0, W, H); }
function shake(T, amount) { if (amount > 0) ctx.translate((Math.sin(T * 91) + Math.sin(T * 37)) * amount, (Math.cos(T * 73) + Math.sin(T * 53)) * amount); }
const font = (s, w = 900) => `${w} ${s}px "Segoe UI Black", "Segoe UI", system-ui, sans-serif`;

// big words in the middle (title cards): slam in, hold, go
function slam(text, u, { size = 110, y = H / 2, color = "#fff", sub = null, dur = 99, weight = 900, accent = null, glow = null, slow = false } = {}) {
  if (u < 0 || u > dur) return;
  const k = out3(clamp(u / (slow ? 0.9 : 0.2))), fade = clamp((dur - u) / 0.18);
  ctx.save(); ctx.globalAlpha = clamp(k * 1.4) * fade; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = font(size, weight); if (ctx.letterSpacing !== undefined) ctx.letterSpacing = `${Math.round(size * 0.05)}px`;
  let wid = ctx.measureText(text).width; if (wid > W - 220) { size = Math.floor(size * (W - 220) / wid); ctx.font = font(size, weight); wid = ctx.measureText(text).width; }
  ctx.translate(W / 2, y); const s = 1 + (1 - k) * (slow ? 0.1 : 0.55) + u * 0.012; ctx.scale(s, s);
  ctx.shadowColor = glow || "rgba(0,0,0,.85)"; ctx.shadowBlur = glow ? 50 : 30;
  if (!slow && u < 0.08) { ctx.fillStyle = "rgba(255,40,60,.7)"; ctx.fillText(text, 8, 0); ctx.fillStyle = "rgba(40,220,255,.7)"; ctx.fillText(text, -8, 0); }
  ctx.fillStyle = color; ctx.fillText(text, 0, 0);
  if (accent) { ctx.shadowBlur = 0; ctx.fillStyle = accent; ctx.fillRect(-wid / 2, size * 0.62, wid * clamp(u / 0.5), 9); }
  if (sub) { ctx.shadowColor = "rgba(0,0,0,.85)"; ctx.shadowBlur = 20; ctx.font = `600 ${Math.round(size * 0.24)}px "Segoe UI", system-ui, sans-serif`;
    if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "4px"; ctx.fillStyle = "#d6dcd8"; ctx.fillText(sub, 0, size * 0.98); }
  ctx.restore();
}
// a feature's name over the app: a dark band at the bottom, the name slides in on the beat
function lower(title, sub, u, dur, color = "#fff") {
  if (u < 0 || u > dur) return;
  const k = out3(clamp(u / 0.25)), f = clamp((dur - u) / 0.2), x = 130;
  ctx.save();
  const band = ctx.createLinearGradient(0, H - 360, 0, H);
  band.addColorStop(0, "rgba(0,0,0,0)"); band.addColorStop(0.45, `rgba(0,0,0,${0.72 * f})`); band.addColorStop(1, `rgba(0,0,0,${0.9 * f})`);
  ctx.fillStyle = band; ctx.fillRect(0, H - 360, W, 360);
  ctx.globalAlpha = clamp(k * 1.3) * f; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  let size = 84; ctx.font = font(size); if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "3px";
  const wid = ctx.measureText(title).width; if (wid > W - 2 * x) { size = Math.floor(size * (W - 2 * x) / wid); ctx.font = font(size); }
  const dx = (1 - k) * -70;
  ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 24;
  if (u < 0.1) { ctx.fillStyle = "rgba(255,40,60,.75)"; ctx.fillText(title, x + dx + 7, H - 150); ctx.fillStyle = "rgba(40,220,255,.75)"; ctx.fillText(title, x + dx - 7, H - 150); }
  ctx.fillStyle = color; ctx.fillText(title, x + dx, H - 150);
  ctx.shadowBlur = 0; ctx.fillStyle = "#e0283c"; ctx.fillRect(x, H - 128, clamp(u / 0.45) * 140, 6);
  if (sub) { ctx.font = '500 36px "Segoe UI", system-ui, sans-serif'; if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "1px";
    ctx.fillStyle = "#dfe5e1"; ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 14; ctx.fillText(sub, x + dx * 0.5, H - 75); }
  ctx.restore();
}
// a credit, like a film's: who gave the app this part, at the moment it pays off (top left)
function credit(role, name, u, dur = 1.8, y = 175) {
  if (u < 0 || u > dur) return;
  const k = out3(clamp(u / 0.3)), f = clamp((dur - u) / 0.3), x = 130;
  ctx.save();
  const bg = ctx.createLinearGradient(0, 0, 1100, 0); bg.addColorStop(0, `rgba(0,0,0,${0.8 * k * f})`); bg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = bg; ctx.fillRect(0, y - 60, 1200, 175);
  ctx.globalAlpha = k * f; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 20;
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "8px";
  ctx.font = '700 26px "Segoe UI", system-ui, sans-serif'; ctx.fillStyle = "#e0b25a"; ctx.fillText(role, x + (1 - k) * 40, y);
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "2px";
  let size = 64; ctx.font = font(size); const wid = ctx.measureText(name).width; if (wid > W - 260) { size = Math.floor(size * (W - 260) / wid); ctx.font = font(size); }
  if (u < 0.12) { ctx.fillStyle = "rgba(255,40,60,.8)"; ctx.fillText(name, x + 6, y + 70); ctx.fillStyle = "rgba(40,220,255,.8)"; ctx.fillText(name, x - 6, y + 70); }
  ctx.fillStyle = "#fff"; ctx.fillText(name, x, y + 70);
  ctx.restore();
}

// a coach comes on: the camera moves in on them, their name large on the left
function coachShot(clip, ct, u, dur, name, role) {
  const r = mark(clip, "coach") || [1490, 746, 400, 309], Wt = 1100, Ht = Wt * 9 / 16;
  const to = [clamp(r[0] + r[2] + 30 - Wt, 0, W - Wt), clamp(r[1] + r[3] + 25 - Ht, 0, H - Ht), Wt, Ht];
  drawClip(clip, ct + u, FULL, to, u / Math.min(dur, 1.6));
  const k = out3(clamp((u - 0.3) / 0.35)), f = clamp((dur - u) / 0.25), x = 110, y = 470;
  if (u < 0.3) return;
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 900, 0); g.addColorStop(0, `rgba(0,0,0,${0.82 * k * f})`); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, y - 150, 1000, 300);
  ctx.globalAlpha = k * f; ctx.textAlign = "left"; ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 24;
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "10px";
  ctx.font = font(150); ctx.fillStyle = GOLD; ctx.fillText(name, x + (1 - k) * -60, y + 30);
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "2px";
  ctx.font = '600 36px "Segoe UI", system-ui, sans-serif'; ctx.fillStyle = "#e8ede9"; ctx.fillText(role, x, y + 95);
  ctx.shadowBlur = 0; ctx.fillStyle = "#e0283c"; ctx.fillRect(x, y + 52, clamp((u - 0.3) / 0.5) * 160, 6);
  ctx.restore();
}

// ---------- the cut: [start, end, draw(u, T)] in seconds ----------
const CUT = [];
const at = (a, b, f, o = {}) => CUT.push({ a, b, f, ...o });
const box = (n, pad = 1.25) => around(mark(n, "board"), pad), page = n => around(mark(n, "page"), 1.0);
const RED = "#e0283c", GOLD = "#ffcf6e", GREEN = "#36c27a";
const bg = T => drawFilm(2.6 + T * 0.3, 0.55);  // the dark board behind the opening's words, moving slowly
const card = (a, b, f, o = {}) => at(a, b, (u, T) => { bg(T); f(u, T); }, { embers: 0.8, ...o });

// ===== 0 – 30: Hitman. Slow and tense; the narrator; Maya; your mistakes, found =====
at(0, HB[0], () => {}, { embers: 0.3 });
card(HB[0], HB[2], (u) => slam(CREATOR.toUpperCase() + " PRESENTS", u, { size: 44, weight: 600, dur: HB[2] - HB[0], color: "#e6dfd0", slow: true }));
card(HB[2], HB[5], (u) => slam("KNIGHTWISE", u, { size: 130, dur: HB[5] - HB[2], color: "#f4efe4", accent: RED, glow: "rgba(224,40,60,.35)", slow: true }), { embers: 1 });
card(HB[5], HB[7], (u) => slam("EVERY GAME YOU LOSE…", u, { size: 82, dur: HB[7] - HB[5], slow: true }));
card(HB[7], HB[10], (u, T) => { ctx.save(); shake(T, 6 * clamp(1 - u / 0.4)); slam("HAS A LESSON IN IT.", u, { size: 100, dur: HB[10] - HB[7], color: GOLD }); ctx.restore(); }, { embers: 1, flash: 0.35, punch: true });
card(HB[10], HB[12], (u) => slam("MOST PLAYERS NEVER FIND IT.", u, { size: 74, dur: HB[12] - HB[10], color: "#cfc8bb", slow: true }), { embers: 0.5 });
// Maya comes on, and says who she is
at(HB[12], HB[16], (u) => {
  coachShot("maya", 0.5, u, HB[16] - HB[12], "MAYA", "your coach for games and practice");
  credit("THE VOICES", "KOKORO", u - 1.3, HB[16] - HB[12] - 1.4);
}, { app: true, flash: 0.5 });
// your mistakes: found, explained, and how hard they were
card(HB[16], HB[17], (u, T) => { ctx.save(); shake(T, 8 * clamp(1 - u / 0.3)); slam("YOUR MISTAKES.", u, { size: 120, dur: HB[17] - HB[16], color: RED }); ctx.restore(); }, { flash: 0.6, punch: true });
at(HB[17], HB[20], (u) => {
  drawClip("review", 1.5 + u, box("review", 1.5), box("review", 1.25), u / (HB[20] - HB[17]));
  lower("FOUND IN YOUR REAL GAMES", "the moments that cost you, and the better move", u - 0.1, HB[20] - HB[17] - 0.15);
  credit("THE ENGINE", "STOCKFISH", u - 0.6, HB[20] - HB[17] - 0.7);
}, { app: true, flash: 0.3 });
card(HB[20], HB[21], (u, T) => { ctx.save(); shake(T, 6 * clamp(1 - u / 0.3)); slam("EXPLAINED.", u, { size: 120, dur: HB[21] - HB[20], color: GOLD }); ctx.restore(); }, { flash: 0.5, punch: true });
at(HB[21], HB[24], (u) => {
  const w = around(mark("review", "walk"), 1.12);
  drawClip("review", 6.3 + u * 0.9, w, zoomIn(w, 0.94), u / (HB[24] - HB[21]));
}, { app: true, flash: 0.25 });
card(HB[24], HB[26], (u) => slam("HOW HARD WAS IT, REALLY?", u, { size: 92, dur: HB[26] - HB[24], color: GOLD }), { flash: 0.4, punch: true });
at(HB[26], HB[28], (u) => {
  const b = around(mark("review", "hard"), 1.5);
  drawClip("review", 10.3, b, zoomIn(b, 0.93), u / (HB[28] - HB[26]));

const S = "/ui/vendor/film/", VO = "/ui/vendor/trailer/voice/";

function room(ac, seconds = 3.2) {  // a big hall: what lets the last hit ring

// The video, frame by frame: never live, so a slow or hidden window can't drop frames (a window behind others gets
// about one frame a second). H.264 and AAC in an MP4, what the Microsoft Store and YouTube take, with the browser's
// own encoders and mp4-muxer (MIT) to put them together.
async function make() {
  const msg = t => { document.getElementById("msg").textContent = t; };

  msg("Setting up…"); await loadFilm();

    aenc.encode(ad); ad.close();
  }
  const N = Math.round(LENGTH * FPS);

    if (failed) break;
    render(n / FPS);

  const j = await res.json().catch(() => ({}));
  msg(res.ok ? `Saved: ${j.path}` : (j.message || "Couldn't save it."));
  window.trailerDone = res.ok ? j.path : "failed";
}
