<style>body{background:#0a0a0a;color:#f2f2f2;font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;margin:0}

<main><h1>Talk with your coach on chess.com</h1>
<p>So Maya can hear you, Chrome asks once whether Knightwise may use your microphone. It listens only after you press Talk,

<button id="allow">Allow the microphone</button><p id="state"></p></main>
